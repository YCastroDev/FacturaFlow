# La conexión a la base se lee SOLO desde variables de entorno (sin valores por defecto).
spring:
  application:
    name: sales
  datasource:
    url: ${SALES_DB_URL}
    username: ${SALES_DB_USER}
    password: ${SALES_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # El esquema lo gestiona Flyway; Hibernate solo valida.
    properties:
      hibernate:
        # El listado carga líneas e impuestos de toda la página en una consulta por nivel, no una por venta.
        default_batch_fetch_size: 100
  flyway:
    locations: classpath:db/migration
  # RabbitMQ (ADR 0013). Conexión SOLO desde variables de entorno; la contraseña sin valor por defecto.
  rabbitmq:
    host: ${SALES_RABBITMQ_HOST:localhost}
    port: ${SALES_RABBITMQ_PORT:5672}
    virtual-host: ${SALES_RABBITMQ_VHOST:facturaflow}
    username: ${SALES_RABBITMQ_USER:sales}
    password: ${SALES_RABBITMQ_PASSWORD}
    # Con el broker caído, cada ciclo del relay falla rápido en vez de quedarse esperando.
    connection-timeout: 2s
    # Publisher confirms por mensaje (CorrelationData): se marca publicado solo lo que el broker confirmó (y, en el
    # consumidor, se confirma el original solo tras republicarlo en una espera o en la DLQ).
    publisher-confirm-type: correlated
    listener:
      simple:
        # Un mensaje a la vez por consumidor (ADR 0015).
        prefetch: 1
        # Si la cola aún no existe (RabbitMQ recién levantado), el consumidor reintenta en vez de detenerse.
        missing-queues-fatal: false
  # Resource server (ADR 0018). Sin "issuer-uri" como fuente de descubrimiento: las claves se piden a la URL INTERNA
  # de Keycloak (jwk-set-uri, solo con el primer token: el servicio arranca sin Keycloak) y el "iss" esperado es el
  # FIJO del realm (KC_HOSTNAME, ADR 0017), el mismo dentro y fuera de Docker. Boot valida además firma y vigencia.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SECURITY_JWT_ISSUER:http://localhost:8180/realms/facturaflow}
          jwk-set-uri: ${SECURITY_JWT_JWK_SET_URI:http://keycloak:8080/realms/facturaflow/protocol/openid-connect/certs}
          audiences: facturaflow-api
  jackson:
    deserialization:
      # Un campo mal escrito (p. ej. "cantidad") da 400 en vez de ignorarse sin aviso.
      fail-on-unknown-properties: true

sales:
  # Zona de la fecha de la venta (la fecha legal es la de Colombia, no la del servidor).
  time-zone: America/Bogota
  # Cliente de catalog (ADR 0012). Por qué cada valor: ADR 0012.
  catalog:
    # En docker compose: http://catalog:8080 (variable SALES_CATALOG_BASE_URL).
    base-url: ${SALES_CATALOG_BASE_URL:http://localhost:8082}
    # Catalog está en la misma red: conectar toma milisegundos; 1 s ya es un problema.
    connect-timeout: 1s
    # Las dos consultas de catalog son lecturas por índice; 2 s de espera es mucho para un usuario en caja.
    read-timeout: 2s
    # Retry-After del 503 cuando una llamada falla (con el circuito abierto, lo que falta para que pruebe).
    failure-retry-after: 5s
    # Identidad de sales ante catalog (ADR 0018): client credentials con el cliente confidencial sales-service.
    # El token (5 min) se guarda en memoria y se renueva 60 s antes de vencer. El secreto, SOLO por variable de entorno.
    auth:
      token-uri: ${SALES_KEYCLOAK_TOKEN_URI:http://keycloak:8080/realms/facturaflow/protocol/openid-connect/token}
      client-id: ${SALES_SERVICE_CLIENT_ID:sales-service}
      client-secret: ${SALES_SERVICE_CLIENT_SECRET}
      # Keycloak está en la misma red y el token endpoint responde en milisegundos (mismo criterio que catalog).
      connect-timeout: 1s
      read-timeout: 2s
      renew-before-expiry: 60s
    resilience:
      retry:
        # 1 reintento (2 intentos) SOLO si la petición no salió (conexión rechazada, nombre sin resolver,
        # timeout de conexión) o ante 502/503/504: un reinicio de catalog. Nunca tras un timeout de lectura.
        max-attempts: 2
        backoff: 200ms
        jitter: 0.5
      circuit-breaker:
        # Cada venta hace 2 llamadas: con catalog caído, el circuito abre hacia la 3.ª venta fallida.
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2

  # Eventos (ADR 0013): exchange del servicio y espera de las confirmaciones del broker.
  messaging:
    exchange: sales.events
    # Un lote de 50 mensajes pequeños se confirma en milisegundos; 5 s solo se agotan si el broker está en
    # problemas. Lo no confirmado a tiempo queda pendiente (y puede publicarse dos veces: al menos una vez).
    confirm-timeout: 5s
  # Consumo de los resultados de facturación de invoicing (ADR 0015). Mismos valores y razones que el consumidor de
  # invoicing (ADR 0014): esperas crecientes, 1 consumidor (solo actualiza ventas: rápido y sin duplicados en paralelo).
  invoice-results:
    queue: sales.invoice-results
    source-exchange: invoicing.events
    routing-keys: invoice.issued.v1,invoice.rejected.v1,invoice-request.rejected.v1
    retry-exchange: sales.retry
    # Por aquí el broker devuelve a la cola un mensaje cuya espera venció (no por el exchange por defecto).
    requeue-exchange: sales.requeue
    dead-letter-exchange: sales.dlx
    retry-delays: 10s,1m,5m
    confirm-timeout: 5s
    concurrency: 1
  # Relay del outbox (ADR 0013).
  outbox:
    # Cada cuánto se revisan los pendientes. 1 s: la factura empieza a crearse casi enseguida y, sin eventos,
    # cada consulta es una lectura vacía del índice parcial.
    poll-interval: 1s
    # Eventos por ciclo (y por transacción). Rendimiento máximo por instancia ~ batch-size / poll-interval.
    batch-size: 50

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # Botón "Authorize" (ADR 0018): authorization code + PKCE con el cliente público facturaflow-swagger.
    oauth:
      client-id: facturaflow-swagger
      use-pkce-with-authorization-code-grant: true
  api-docs:
    path: /v3/api-docs

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

# Actuator: solo lectura y nada sensible. El puerto solo se publica en 127.0.0.1 (docker-compose). El health es
# público (healthcheck y prueba de humo); el resto exige el rol admin (ADR 0018).
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,circuitbreakerevents,retries
  endpoint:
    health:
      show-details: never
      show-components: never
      group:
        # /actuator/health/dependencies: los componentes informativos "catalog" (estado del circuito, ADR 0012)
        # y "messaging" (outbox y relay, ADR 0013; consumidor de resultados de facturación, ADR 0015). Siempre UP: una dependencia caída no baja
        # el health de sales ni entra en liveness/readiness.
        dependencies:
          include: catalog,messaging
          show-details: always
          show-components: always
  health:
    # El indicador de Resilience4j bajaría el health con el circuito abierto; se usa el componente propio.
    circuitbreakers:
      enabled: false
    # Spring Boot agrega solo el indicador "rabbit" al ver RabbitMQ en el classpath, y con el broker caído
    # pondría /actuator/health en DOWN. Se reemplaza por el componente informativo "messaging" (ADR 0013).
    rabbit:
      enabled: false
