# La conexión a la base se lee SOLO desde variables de entorno (sin valores por defecto).
spring:
  application:
    name: invoicing
  datasource:
    url: ${INVOICING_DB_URL}
    username: ${INVOICING_DB_USER}
    password: ${INVOICING_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # El esquema lo gestiona Flyway; Hibernate solo valida.
  flyway:
    locations: classpath:db/migration
  jackson:
    deserialization:
      # Un campo mal escrito (p. ej. "observacion") da 400 en vez de ignorarse sin aviso (ADR 0006).
      fail-on-unknown-properties: true

invoicing:
  # Proveedor de facturación electrónica: "fake" (simulado, ADR 0006). Se puede sobrescribir con
  # la variable INVOICING_PROVIDER. Un valor sin implementación hace fallar el arranque.
  provider: fake
  # Zona de la fecha de emisión (la fecha legal es la de Colombia, no la del servidor).
  time-zone: America/Bogota

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never
