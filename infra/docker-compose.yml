# Entorno local de FacturaFlow.
# Ejecutar desde la raíz del repo:
#   docker compose --env-file .env -f infra/docker-compose.yml up --build
# Todas las credenciales salen del .env de la raíz (no versionado).
name: facturaflow

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:?Define POSTGRES_SUPERUSER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Define POSTGRES_SUPERUSER_PASSWORD en .env}
      POSTGRES_DB: postgres
      # Contraseñas de los usuarios de cada servicio (las usa el script de init)
      INVOICING_DB_PASSWORD: ${INVOICING_DB_PASSWORD:?Define INVOICING_DB_PASSWORD en .env}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Define CATALOG_DB_PASSWORD en .env}
      SALES_DB_PASSWORD: ${SALES_DB_PASSWORD:?Define SALES_DB_PASSWORD en .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Define KEYCLOAK_DB_PASSWORD en .env}
    volumes:
      # PostgreSQL 18+: el volumen se monta en /var/lib/postgresql
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    # Sin "ports": PostgreSQL solo es accesible dentro de la red de Docker.

  # Broker de eventos entre servicios (ADR 0013). Imagen oficial con la consola de administración.
  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    # Nombre de nodo fijo (rabbit@rabbitmq): RabbitMQ guarda sus datos bajo ese nombre; si cambiara con
    # cada contenedor, el volumen quedaría huérfano y se perderían exchanges y mensajes.
    hostname: rabbitmq
    environment:
      # Administrador: solo para la consola y el script de init. Los servicios usan su propio usuario.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_ADMIN_USER:?Define RABBITMQ_ADMIN_USER en .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_PASSWORD:?Define RABBITMQ_ADMIN_PASSWORD en .env}
      RABBITMQ_DEFAULT_VHOST: facturaflow
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # Plugins: los de la imagen (consola, Prometheus) + shovel, para mover mensajes de una DLQ a su cola
      # ("Move messages" en la consola y scripts/rabbitmq-dlq.sh; ADR 0014).
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      # Solo la consola (http://localhost:15672). El 5672 (AMQP) no se publica: los servicios lo usan
      # dentro de la red de Docker y los tests levantan su propio RabbitMQ con Testcontainers.
      - "127.0.0.1:15672:15672"
    healthcheck:
      # Nodo arriba y escuchando en todos sus puertos (AMQP y la API HTTP que usa rabbitmq-init).
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Contenedor de un solo uso: crea el vhost y el usuario de cada servicio con permisos mínimos y termina
  # (script idempotente, como el de PostgreSQL). Se repite en cada "up".
  rabbitmq-init:
    image: rabbitmq:4.4.0-management-alpine
    entrypoint: ["sh", "/init/create-service-users.sh"]
    environment:
      RABBITMQADMIN_BASE_URI: http://rabbitmq:15672/api
      RABBITMQADMIN_USERNAME: ${RABBITMQ_ADMIN_USER:?Define RABBITMQ_ADMIN_USER en .env}
      RABBITMQADMIN_PASSWORD: ${RABBITMQ_ADMIN_PASSWORD:?Define RABBITMQ_ADMIN_PASSWORD en .env}
      RABBITMQ_VHOST: facturaflow
      SALES_RABBITMQ_PASSWORD: ${SALES_RABBITMQ_PASSWORD:?Define SALES_RABBITMQ_PASSWORD en .env}
      INVOICING_RABBITMQ_PASSWORD: ${INVOICING_RABBITMQ_PASSWORD:?Define INVOICING_RABBITMQ_PASSWORD en .env}
    volumes:
      - ./rabbitmq/init:/init:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: "no"

  # Proveedor de identidad (ADR 0017). Perfil de producción ("start") sobre HTTP: la misma configuración que en
  # producción salvo TLS. El realm "facturaflow" se importa del repositorio al arrancar, SOLO si aún no existe (un
  # realm ya importado no se toca: para aplicar cambios del archivo o del .env, ver el README).
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Define KEYCLOAK_DB_PASSWORD en .env}
      KC_HTTP_ENABLED: "true"
      # Issuer FIJO: los tokens dicen siempre http://localhost:8180/realms/facturaflow, se pidan desde la terminal o
      # desde un contenedor; las llamadas internas (keycloak:8080) usan su propia URL (backchannel dinámico).
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Health en el puerto de gestión 9000 (no se publica; lo usa el healthcheck).
      KC_HEALTH_ENABLED: "true"
      # Un solo nodo: caché local (sin el clúster de Infinispan).
      KC_CACHE: local
      # Administrador inicial del realm master (consola). Se crea solo en el primer arranque.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?Define KEYCLOAK_ADMIN_USER en .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Define KEYCLOAK_ADMIN_PASSWORD en .env}
      # Valores que el realm referencia como ${VAR} (nunca escritos en el archivo; RealmFileSecretsTest lo verifica).
      KC_DEMO_ADMIN_PASSWORD: ${KC_DEMO_ADMIN_PASSWORD:?Define KC_DEMO_ADMIN_PASSWORD en .env}
      KC_DEMO_VENDEDOR_PASSWORD: ${KC_DEMO_VENDEDOR_PASSWORD:?Define KC_DEMO_VENDEDOR_PASSWORD en .env}
      KC_DEMO_CONTADOR_PASSWORD: ${KC_DEMO_CONTADOR_PASSWORD:?Define KC_DEMO_CONTADOR_PASSWORD en .env}
      SALES_SERVICE_CLIENT_SECRET: ${SALES_SERVICE_CLIENT_SECRET:?Define SALES_SERVICE_CLIENT_SECRET en .env}
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    ports:
      # Consola (http://localhost:8180/admin) y endpoints del realm, solo en la máquina local.
      - "127.0.0.1:8180:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # La imagen no trae curl ni wget: petición HTTP a mano con /dev/tcp de bash.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    restart: unless-stopped

  invoicing:
    build:
      context: ../services/invoicing
    environment:
      INVOICING_DB_URL: jdbc:postgresql://postgres:5432/invoicing_db
      INVOICING_DB_USER: invoicing_user
      INVOICING_DB_PASSWORD: ${INVOICING_DB_PASSWORD:?Define INVOICING_DB_PASSWORD en .env}
      # Proveedor de facturación: fake (por defecto) o factus (sandbox real, ADR 0008).
      INVOICING_PROVIDER: ${INVOICING_PROVIDER:-fake}
      # Solo se usan con INVOICING_PROVIDER=factus; la aplicación no arranca si faltan.
      FACTUS_BASE_URL: ${FACTUS_BASE_URL:-https://api-sandbox.factus.com.co}
      FACTUS_CLIENT_ID: ${FACTUS_CLIENT_ID:-}
      FACTUS_CLIENT_SECRET: ${FACTUS_CLIENT_SECRET:-}
      FACTUS_USERNAME: ${FACTUS_USERNAME:-}
      FACTUS_PASSWORD: ${FACTUS_PASSWORD:-}
      FACTUS_SEND_EMAIL: ${FACTUS_SEND_EMAIL:-false}
      FACTUS_NUMBERING_RANGE_ID: ${FACTUS_NUMBERING_RANGE_ID:-}
      FACTUS_CREDIT_NOTE_NUMBERING_RANGE_ID: ${FACTUS_CREDIT_NOTE_NUMBERING_RANGE_ID:-}
      # Consumo de SaleConfirmed (ADR 0014): usuario propio con permisos mínimos sobre invoicing.*.
      INVOICING_RABBITMQ_HOST: rabbitmq
      INVOICING_RABBITMQ_PORT: 5672
      INVOICING_RABBITMQ_VHOST: facturaflow
      INVOICING_RABBITMQ_USER: invoicing
      INVOICING_RABBITMQ_PASSWORD: ${INVOICING_RABBITMQ_PASSWORD:?Define INVOICING_RABBITMQ_PASSWORD en .env}
      # Proveedor falso: emisiones que fallan antes de funcionar con SIMULAR_FALLA_TEMPORAL. 4 = los intentos
      # del consumidor (1 + 3 esperas): la venta llega a la DLQ y al reprocesarla se emite (README).
      INVOICING_FAKE_TEMPORARY_FAILURES: ${INVOICING_FAKE_TEMPORARY_FAILURES:-4}
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      # Invoicing arranca y atiende su API sin RabbitMQ; el listener se reconecta solo (ADR 0014).
      rabbitmq:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  catalog:
    build:
      context: ../services/catalog
    environment:
      CATALOG_DB_URL: jdbc:postgresql://postgres:5432/catalog_db
      CATALOG_DB_USER: catalog_user
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Define CATALOG_DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  sales:
    build:
      context: ../services/sales
    environment:
      SALES_DB_URL: jdbc:postgresql://postgres:5432/sales_db
      SALES_DB_USER: sales_user
      SALES_DB_PASSWORD: ${SALES_DB_PASSWORD:?Define SALES_DB_PASSWORD en .env}
      # URL de catalog (no es un secreto). Se puede apuntar a otra para demostraciones.
      SALES_CATALOG_BASE_URL: ${SALES_CATALOG_BASE_URL:-http://catalog:8080}
      # Publicación de eventos (ADR 0013): usuario propio, solo puede publicar en sales.events.
      SALES_RABBITMQ_HOST: rabbitmq
      SALES_RABBITMQ_PORT: 5672
      SALES_RABBITMQ_VHOST: facturaflow
      SALES_RABBITMQ_USER: sales
      SALES_RABBITMQ_PASSWORD: ${SALES_RABBITMQ_PASSWORD:?Define SALES_RABBITMQ_PASSWORD en .env}
    ports:
      - "127.0.0.1:8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
      # Solo "iniciado", no "sano": sales arranca aunque catalog esté caído (su health no depende de catalog).
      catalog:
        condition: service_started
      # Igual con RabbitMQ: sales arranca y vende sin él; los eventos esperan en el outbox (ADR 0013).
      # Tampoco espera a rabbitmq-init: si su usuario aún no existe, el publicador reintenta solo.
      rabbitmq:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  # Punto de entrada único a la API (ADR 0017). En la Fase 1 solo enruta, sin exigir token.
  gateway:
    build:
      context: ../services/gateway
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      # Solo "iniciados": el gateway arranca y su health es UP aunque un servicio esté caído (responde 502 en su ruta).
      invoicing:
        condition: service_started
      catalog:
        condition: service_started
      sales:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
